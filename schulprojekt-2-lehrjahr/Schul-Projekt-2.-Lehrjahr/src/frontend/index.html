<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <script src="../backend/js/index.js" defer></script>
</head>

<body>
    <h1>Restaurant</h1>

    <h2>Essensliste</h2>
    <button type="button" id="addFood">Essen hinzufügen</button><br><br>
    <table id="food-table">
        <thead>
            <tr>
                <th>Pos</th>
                <th>Gericht</th>
                <th>Preis</th>
                <th>Vegetarisch</th>
            </tr>
        </thead>
        <tbody id="foodTableBody"></tbody>
    </table>

    <h2>Bestellübersicht</h2>
    <table id="food-table">
        <thead>
            <tr>
                <th>Menge</th>
                <th>Gericht</th>
                <th>Preis</th>
                <th>Gesamt</th>
            </tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
    </table>
    <button type="button" id="placeOrder">Bestellen</button>

    <div id="addFoodWindow">
        <h2>Essen hinzufügen</h2>
        <form id="addForm">
            <label for="addMeal">Gericht:</label>
            <input type="text" id="addMeal" required><br><br>
            <label for="addPrice">Preis:</label>
            <input type="number" id="addPrice" step="0.01" required><br><br>
            <label for="addVegetable">Vegetarisch:</label>
            <input type="checkbox" id="addVegetable"><br><br>
            <button type="submit">Speichern</button>
            <button type="button" id="closeAddWindow">Abbrechen</button>
        </form>
    </div>

    <div id="editFoodWindow">
        <h2>Essen bearbeiten</h2>
        <form id="editForm">
            <label for="editMeal">Gericht:</label>
            <input type="text" id="editMeal" required><br><br>
            <label for="editPrice">Preis:</label>
            <input type="number" id="editPrice" step="0.01" required><br><br>
            <label for="editVegetable">Vegetarisch:</label>
            <input type="checkbox" id="editVegetable"><br><br>
            <button type="submit">Speichern</button>
            <button type="button" id="closeEditWindow">Abbrechen</button>
        </form>
    </div>

    <div id="deleteFoodWindow">
        <h2>Möchtest du das Essen wirklich löschen?</h2>
        <button type="button" id="deleteFoodYes">Ja</button>
        <button type="button" id="deleteFoodNo">Abbrechen</button>
    </div>
</body>
</html>
