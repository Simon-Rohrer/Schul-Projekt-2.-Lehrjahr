<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <script src="../backend/js/index.js" defer></script>
</head>

<body>
    <div>
        <h1>Restaurant</h1>
        
        <h2>Essensliste</h2>
        <div>
            <button type="button" id="addFood">Essen hinzufügen</button><br><br>
        </div>
        <table id="food-table">
            <thead>
                <th>Pos</th>
                <th>Gericht</th>
                <th>Preis</th>
                <th>Vegetarisch</th>
            </thead>
            <tbody id="foodTableBody"></tbody>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td><button type="button" id="addToOrder">Add to Order</button></td>
                <td><button type="button" id="editFood">Edit</button></td>
                <td><button type="button" id="deleteFood">Delete</button></td>
            </tr>
        </table>
        
        <h2>Bestellübersicht</h2>
        <table id="food-table">
            <thead>
                <tr>
                    <th>Menge</th>
                    <th>Gericht</th>
                    <th>Preis</th>
                    <th>Gesamt</th>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </thead>
        </table>
    </div>
    <div id="addFoodWindow" class="window">
        <div class="window-content">
            <h2>Essen hinzufügen</h2>
            <form id="edit-form">
                <label for="meal">Gericht:</label>
                <input type="text" id="meal" name="meal" required><br><br>
                <lable for="price">Preis:</label>
                <input type="number" id="price" name="price" required><br><br>
                <label for="vegetable">Vegetarisch:</label>
                <input type="checkbox" id="vegetable" name="vegetable"><br><br>
                <button type="submit">Speichern</button>
                <button type="button" id="closeAddWindow">Abbrechen</button>
            </form>
        </div>
    </div>
    <div id="editFoodWindow" class="window">
        <div class="window-content">
            <h2>Essen bearbeiten</h2>
            <form id="edit-form">
                <label for="meal">Gericht:</label>
                <input type="text" id="meal" name="meal" required><br><br>
                <lable for="price">Preis:</label>
                <input type="number" id="price" name="price" required><br><br>
                <label for="vegetable">Vegetarisch:</label>
                <input type="checkbox" id="vegetable" name="vegetable"><br><br>
                <button type="submit">Speichern</button>
                <button type="button" id="closeEditWindow">Abbrechen</button>
            </form>
        </div>
    </div>
        <div id="deleteFoodWindow" class="window">
        <div class="window-content">
            <h2>Möchtest du das Essen wirklich löschen?</h2>
            <form id="edit-form">
                <button type="button" id="deleteFoodYes">Ja</button>
                <button type="button" id="deleteFoodNo">Abbrechen</button>
            </form>
        </div>
    </div>
</body>
</html>
